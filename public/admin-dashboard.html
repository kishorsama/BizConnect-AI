<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <h2>Admin Dashboard</h2>
        <div class="user-info">
            <span id="userName"></span>
            <button onclick="Auth.logout()" class="btn-logout">Logout</button>
        </div>
    </nav>
    
    <main class="dashboard-content">
        <h1>Platform Governance</h1>
        <div class="dashboard-grid">
            <div class="card">
                <h3>Vendor Approval</h3>
                <p>Review and manage new vendor applications.</p>
            </div>
            <div class="card">
                <h3>Fraud Detection</h3>
                <p>Monitor transactions for suspicious activity.</p>
            </div>
            <div class="card">
                <h3>Dispute Resolution</h3>
                <p>Mediate and resolve disputes between users.</p>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Protect this page - only 'admin' role is allowed
        Auth.protectPage(['admin']);
        
        // Personalize the page
        const user = Auth.getCurrentUser();
        if (user) {
            document.getElementById('userName').textContent = `Welcome, ${user.name}`;
        }
    </script>
</body>
</html>
