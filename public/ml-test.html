<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Predictions Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>ML Predictions Test</h1>
    
    <div class="test-section">
        <h3>1. Test Global Predictions (No Token)</h3>
        <button onclick="testGlobalPredictions()">Test Global</button>
        <div id="global-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Test Vendor-Specific Predictions</h3>
        <button onclick="testVendorPredictions()">Test Vendor</button>
        <div id="vendor-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Compare Results</h3>
        <button onclick="compareResults()">Compare</button>
        <div id="compare-result" class="result"></div>
    </div>

    <script>
        let globalData = null;
        let vendorData = null;

        async function testGlobalPredictions() {
            const resultDiv = document.getElementById('global-result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch('/api/ml/top-products?limit=3');
                const data = await response.json();
                
                globalData = data;
                resultDiv.innerHTML = `
                    <div class="success">✅ Global predictions loaded</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testVendorPredictions() {
            const resultDiv = document.getElementById('vendor-result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                // Use a test vendor token
                const token = 'Bearer vendor-68ec2561cd26d26fd25c8ec5-token';
                const response = await fetch('/api/ml/top-products?limit=3', {
                    headers: {
                        'Authorization': token
                    }
                });
                const data = await response.json();
                
                vendorData = data;
                resultDiv.innerHTML = `
                    <div class="success">✅ Vendor predictions loaded</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        function compareResults() {
            const resultDiv = document.getElementById('compare-result');
            
            if (!globalData || !vendorData) {
                resultDiv.innerHTML = '<div class="error">❌ Please run both tests first</div>';
                return;
            }

            const globalProductIds = globalData.products.map(p => p.product_id);
            const vendorProductIds = vendorData.products.map(p => p.product_id);
            
            const isDifferent = JSON.stringify(globalProductIds) !== JSON.stringify(vendorProductIds);
            
            resultDiv.innerHTML = `
                <div class="${isDifferent ? 'success' : 'error'}">
                    ${isDifferent ? '✅' : '❌'} Predictions are ${isDifferent ? 'DIFFERENT' : 'SAME'}
                </div>
                <div><strong>Global Product IDs:</strong> ${globalProductIds.join(', ')}</div>
                <div><strong>Vendor Product IDs:</strong> ${vendorProductIds.join(', ')}</div>
                <div><strong>Are they different?</strong> ${isDifferent}</div>
            `;
        }

        // Auto-run tests on page load
        window.onload = function() {
            console.log('ML Predictions Test Page Loaded');
            console.log('Run the tests to verify vendor-specific predictions are working');
        };
    </script>
</body>
</html>
