<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Global Styles & Variables --- */
        :root {
            --primary-color: #007bff; /* A nice blue for primary actions */
            --secondary-color: #ffc107; /* A contrasting color for secondary actions */
            --text-dark: #333;
            --text-light: #fff;
            --background-light: #f4f7fa; /* Light grey background */
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif; /* Modern, clean font */
            line-height: 1.6;
            background-color: var(--background-light);
            color: var(--text-dark);
            min-height: 100vh; /* Ensure body takes full viewport height */
        }

        .container {
            width: 90%;
            max-width: 1200px; /* Constrain content width */
            margin: 0 auto;
        }

        /* --- Header & Navigation --- */
        .header {
            background-color: var(--text-light);
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo-link {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .logo-link:hover {
            color: #0056b3; /* Darker blue on hover */
        }

        /* --- Buttons (Generalized for Reusability) --- */
        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--text-light);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
        }

        .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: var(--text-dark);
            box-shadow: 0 4px 8px rgba(255, 193, 7, 0.3);
        }

        .btn-secondary:hover {
            background-color: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 193, 7, 0.4);
        }

        .btn-large {
            padding: 15px 30px;
            font-size: 1.1rem;
            margin-top: 25px;
        }

        /* --- Hero Section (The Main Visual Impact) --- */
        .hero-section {
            min-height: calc(100vh - 80px); /* Full height minus approximate header height */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Beautiful gradient background */
            background: linear-gradient(135deg, #007bff 0%, #4facfe 100%);
            color: var(--text-light);
            padding: 50px 20px;
        }

        .hero-content {
            max-width: 800px;
            /* Slight backdrop effect for text readability */
            background: rgba(0, 0, 0, 0.1); 
            padding: 40px;
            border-radius: 15px;
        }

        .hero-content h1 {
            font-size: 3.5rem; /* Large, bold main heading */
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.1;
        }

        .hero-content .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 0;
            opacity: 0.9;
        }

        /* Media Query for smaller screens */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 10px;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .hero-content .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="/" class="logo-link">Multi-Vendor Marketplace</a>
            <a href="login.html" class="btn btn-primary">Login / Sign Up</a>
        </nav>
    </header>
    
    <main class="hero-section">
        <div class="hero-content">
            <h1>The one-stop shop for all your needs.</h1>
            <p class="subtitle">Discover, compare, and buy from thousands of verified vendors.</p>
            <a href="login.html" class="btn btn-secondary btn-large">Start Shopping Now</a>
            
            <!-- Temporary debug button -->
            <div style="margin-top: 20px;">
                <button onclick="clearAuth()" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                    Clear Auth Data (Debug)
                </button>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Debug: Check authentication status
        console.log('Auth status:', Auth.isAuthenticated());
        console.log('Current user:', Auth.getCurrentUser());
        
        // If the user is already logged in, redirect them away from the home page
        if (Auth.isAuthenticated()) {
            console.log('User is authenticated, redirecting to dashboard...');
            Auth.redirectToDashboard();
        } else {
            console.log('User is not authenticated, staying on homepage');
        }
        
        // Add a function to clear authentication (for debugging)
        window.clearAuth = function() {
            Storage.clearAll();
            console.log('Authentication cleared');
            alert('Authentication data cleared. Please refresh the page.');
        };
    </script>
</body>
</html>
